name: iPad build
on:
  workflow_dispatch:
    inputs:
      app:
        type: choice
        options: [YearHeart, ADAPartners]
        default: YearHeart
      mode:
        type: choice
        options: [simulator, signed-ipa]
        default: simulator
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APP: ${{ inputs.app }}
      MODE: ${{ inputs.mode }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      YEARHEART_BUNDLE_ID: ${{ vars.YEARHEART_BUNDLE_ID }}
      ADA_BUNDLE_ID: ${{ vars.ADA_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Simulator build (not installable on a real iPad)
        if: inputs.mode == 'simulator'
        run: |
          set -euo pipefail
          xcodebuild -project PartnerApps.xcodeproj -scheme "$APP" -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          ditto -c -k --keepParent "build/Build/Products/Debug-iphonesimulator/$APP.app" "build/$APP-simulator.zip"
      - name: Import signing materials and archive
        if: inputs.mode == 'signed-ipa'
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          YEARHEART_PROFILE: ${{ secrets.YEARHEART_PROFILE_BASE64 }}
          ADA_PROFILE: ${{ secrets.ADA_PROFILE_BASE64 }}
        run: bash scripts/signed-build.sh
      - name: Download build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.mode }}-${{ github.run_number }}
          path: |
            build/*-simulator.zip
            build/export/*.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Remove signing materials
        if: always() && inputs.mode == 'signed-ipa'
        run: |
          security delete-keychain "$RUNNER_TEMP/ipad-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/ipad-actions.mobileprovision"
