name: PartnerApps
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  YearHeart:
    type: application
    platform: iOS
    sources: [Shared, YearHeart/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: '$(YEARHEART_BUNDLE_ID)'
        YEARHEART_BUNDLE_ID: com.example.yearheart.ipad
        INFOPLIST_KEY_CFBundleDisplayName: YearHeart
        INFOPLIST_KEY_PortalURL: https://artist.yearheart.co.th/
  ADAPartners:
    type: application
    platform: iOS
    sources: [Shared, ADAPartners/Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: '$(ADA_BUNDLE_ID)'
        ADA_BUNDLE_ID: com.example.adapartners.ipad
        INFOPLIST_KEY_CFBundleDisplayName: ADA Partners
        INFOPLIST_KEY_PortalURL: https://partners.ada-music.com/
